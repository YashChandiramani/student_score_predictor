<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

          <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎓 Student Score Predictor
    </div>

    <div class="hamburger" onclick="toggleMenu()">

    <i class="fa-solid fa-bars"></i>

</div>

    <div class="nav-links" id = "navLinks">

        <a href="/dashboard" class="active">Dashboard</a>

        <a href="/profile" class="active">Profile</a>

        <a href="/logout" class="active">Logout</a>

    </div>

</nav>

<div class="auth-container">

    <div class="auth-card card">

        <h2>Edit Profile</h2>

        <form method="POST">

            <input
                type="text"
                name="full_name"
                value="{{ user.full_name }}"
                required
            >

            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                required
            >

            <div class="action-buttons">

                <button
                    type="submit"
                    class="btn btn-primary">

                    💾 Save Changes

                </button>

                <a
                    href="/profile"
                    class="btn btn-danger">

                    ❌ Cancel

                </a>

            </div>

        </form>

    </div>

</div>

<script>

function toggleMenu(){

    document
        .getElementById("navLinks")
        .classList
        .toggle("active");

}

</script>

<footer class="footer">

    <div class="footer-center">

         Made with Passion and Love for Exams 🚀

    </div>

    <div class="footer-right">

        <p>Designed and Crafted by Yash Chandiramani</p>

        <div class="social-links">

            <a href="https://github.com/YashChandiramani" target="_blank">
                <i class="fa-brands fa-github"></i> GitHub
            </a>

            <a href="https://www.linkedin.com/in/yash-chandiramani-589699352/" target="_blank">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>

        </div>

    </div>

</footer>

</body>
</html>
